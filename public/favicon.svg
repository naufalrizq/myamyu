<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square, warna tosca brand -->
  <rect width="32" height="32" rx="7" fill="#2ec4b6"/>

  <!--
    Lucide PawPrint original viewBox: 0 0 24 24
    Scale ke 32x32 dengan transform scale(32/24) = scale(1.333)
    lalu translate sedikit agar centered dengan padding
    Scale: 1.15, offset center: translate(1.2, 0.8)
  -->
  <g transform="translate(1.6, 1.0) scale(1.2)">
    <!-- Toe kiri atas -->
    <circle cx="11" cy="4" r="2" fill="white"/>
    <!-- Toe kanan atas -->
    <circle cx="18" cy="8" r="2" fill="white"/>
    <!-- Toe kanan bawah -->
    <circle cx="20" cy="16" r="2" fill="white"/>
    <!-- Pad utama + toe kiri bawah -->
    <path
      d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"
      fill="white"
    />
  </g>
</svg>
